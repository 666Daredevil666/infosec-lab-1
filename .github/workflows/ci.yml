name: Tests and Security
run-name: "Security checks #${{ github.run_number }}"

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests-and-sast:
    name: API Tests and Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install application and test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          mkdir -p reports
      - name: Test API and security controls
        run: python -m pytest -v --junitxml=reports/pytest.xml
      - name: Exercise API with curl
        if: ${{ !cancelled() }}
        run: python scripts/demo.py
      - name: Bandit SAST (JSON)
        if: ${{ !cancelled() }}
        run: bandit -r src -f json -o reports/bandit.json
      - name: Bandit SAST (HTML)
        if: ${{ !cancelled() }}
        run: bandit -r src -f html -o reports/bandit.html
      - name: Python dependency cross-check
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt -f json -o reports/pip-audit.json
      - name: Upload test and SAST reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-and-sast
          path: reports/
          if-no-files-found: error

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download pinned runtime distributions
        run: |
          mkdir -p dependency-scan reports/owasp
          python -m pip download --only-binary=:all: --no-deps -r requirements.txt -d dependency-scan
      - name: Scan dependencies with OWASP
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: infosec-lab-1
          path: dependency-scan
          format: ALL
          out: reports/owasp
          args: >-
            --enableExperimental
            --disableOssIndex
            --suppression /github/workspace/dependency-check-suppressions.xml
            --failOnCVSS 7
      - name: Verify report covers every runtime dependency
        if: ${{ !cancelled() && hashFiles('reports/owasp/dependency-check-report.json') != '' }}
        run: python scripts/check_dependency_report.py reports/owasp/dependency-check-report.json
      - name: Upload native OWASP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-report
          path: reports/owasp/
          if-no-files-found: error
